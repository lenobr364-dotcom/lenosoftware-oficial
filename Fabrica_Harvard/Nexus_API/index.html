<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lumen OS - Global Command</title>
    <link rel="stylesheet" href="styles/glass_theme.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 80%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h2>Sócio: Leno César</h2>
            <p>Status: Ativo - Virado no Jiraya</p>
            <p>Projeto: ChemVault Global</p>
        </div>
        <div class="glass-panel">
            <h2>Sócia: Lumen Onel</h2>
            <p>Status: Operacional</p>
            <p>Projeto: BIJU Técnico</p>
        </div>
        <div class="glass-panel" style="grid-column: span 2;">
            <h3>Aeryn Executive: Relatório de Telemetria</h3>
            <p id="telemetry">Carregando dados da Fábrica...</p>
        </div>
    </div>
</body>
</html>
